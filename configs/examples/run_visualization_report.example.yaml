kind: visualization_report
config:
  repo_root: "."
  output_dir: output/figures
  mae_table:
    enabled: true
    artifacts:
      - results/lear_op_results/**
      - results/sqra_results/**
      - results/tabpfn_ts_results/**
      - results/tabpfn_local_results/**
    output: output/figures/mae_from_results.pdf
  runtime_table:
    enabled: true
    artifacts:
      - results/lear_op_results/**
      - results/sqra_results/**
      - results/tabpfn_ts_results/**
      - results/tabpfn_local_results/**
    output: output/figures/runtime_from_results.pdf
  probabilistic_forecast:
    enabled: false
    forecast_path: results/sqra_results/era5_fundamental/forecast.csv
    output: output/figures/prob_forecast_example.pdf
    start: "2026-02-02"
    end: "2026-02-05 23:45"
    y_true_col: y_true
    show: false
  anc_bars:
    enabled: false
    fundamental_csv: results/lear_anc_results/era5/c5/d112/exaa/anc_all_feature_results.csv
    exaa_csv: null
    output_dir: output/figures
    top_n: 12
  anc_heatmaps:
    enabled: false
    cluster_parquet: data/clustering/icon_d2_clustering_c5.parquet
    anc_wind: results/lear_anc_results/era5/c5/d112/exaa/anc_wind_feature_results.csv
    anc_solar: results/lear_anc_results/era5/c5/d112/exaa/anc_solar_feature_results.csv
    shapefile: data/shapefile/ne_10m_admin_0_countries.shp
    output_dir: output/figures
    train_days: 112
  evaluation_report:
    enabled: false
    evaluation_dir: results/evaluation/tabpfn_ts_march
    output_dir: output/figures/evaluation
    formats:
      - png
      - pdf
    plots:
      - point_forecast
      - quantile_fan
      - metric_summary
      - coverage
      - error_by_hour
    models: []
    start: "2026-03-03T00:00:00+01:00"
    end: "2026-03-07T23:45:00+01:00"
    y_true_col: y_true
    dpi: 300
    show: false
