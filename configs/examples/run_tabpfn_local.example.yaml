kind: tabpfn_local
config:
  repo_root: "."
  target_tz: Europe/Berlin
  country_code_entsoe: DE_LU
  entsoe_api_key_env: ENTSOE_API_KEY
  entsoe_start_date: "2025-01-01T00:00:00+01:00"
  entsoe_end_date: "2026-04-23T23:45:00+02:00"
  test_start: "2026-04-16T00:00:00+02:00"
  test_end: "2026-04-23T23:45:00+02:00"
  post_regime_start: "2025-10-01T00:00:00+02:00"
  forecast_horizon: 96
  frequency: 15min
  quantiles:
    - 0.1
    - 0.25
    - 0.5
    - 0.75
    - 0.9
  features:
    covariates:
      - exaa
      - load_forecast
      # Add `commodities` here to use the Investing.com commodity instruments below.
      # - commodities
    ntc_neighbors:
      - FR
      - NL
      - AT
      - CH
      - PL
      - CZ
      - DK_1
      - DK_2
    commodities:
      provider: investiny
      lag_days: 2
      lookback_days: 14
      instruments:
        - name: gas_ttf
          investing_id: 1178699
          price_field: close
        - name: brent_oil
          investing_id: 8833
          price_field: close
        - name: co2_eua
          investing_id: 8848
          price_field: close
        - name: coal_rotterdam
          investing_id: 1112838
          price_field: close
  price_lag_days:
    - 1
    - 2
    - 7
  add_calendar_features: true
  curve_feature_sources:
    - exaa
    - load_forecast
  engineered_features:
    holiday: false
    price_daily_stats: false
    price_rolling_stats:
      enabled: false
      windows_days: [7]
    covariate_ramps:
      sources: []
      horizons_mtu: [4, 12]
    interactions:
      seq2_minus_price_lag_d1: false
  train_window_days: 180
  max_train_rows: 1000
  n_estimators: 4
  device: cpu
  fit_mode: low_memory
  n_preprocessing_jobs: 1
  inference_precision: auto
  ignore_pretraining_limits: false
  point_output_type: median
  predict_batch_size: 16
  random_state: 0
  experiment_name: tabpfn_local_exaa_load_lags_d1_d2_d7_n1000_cpu
  export_dir: results/tabpfn_local_results/exaa_load_lags_d1_d2_d7_n1000_cpu
