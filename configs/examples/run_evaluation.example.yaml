kind: evaluation
config:
  repo_root: "."
  target_tz: Europe/Berlin
  test_start: "2025-12-01T00:00:00+01:00"
  test_end: "2026-02-28T23:45:00+01:00"
  skip_dates:
    - "2026-01-22"
  frequency: 15min
  n_periods: 96
  y_true_column: y_true
  quantiles:
    - 0.1
    - 0.25
    - 0.5
    - 0.75
    - 0.9
  prediction_intervals:
    - [0.1, 0.9]
    - [0.25, 0.75]
  significance_level: 0.05
  output_dir: results/evaluation/main
  validate_inputs: true
  run_gw_tests: true
