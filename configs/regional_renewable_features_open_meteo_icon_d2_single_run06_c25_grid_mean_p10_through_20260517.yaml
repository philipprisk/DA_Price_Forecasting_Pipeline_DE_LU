kind: regional_renewable_features
config:
  repo_root: "."
  weather_source: open_meteo
  target_tz: Europe/Berlin

  cluster_file: data/clustering/icon_d2_clustering_c25.parquet
  capacity_file: data/raw/renewable_capacity/installed_capacity.csv
  capacity_map_file: data/processed/renewable_proxy/open_meteo_icon_d2_single_run06_c25_grid_mean_p10_through_20260517_regional_capacity_map.csv
  output_file: data/processed/renewable_proxy/open_meteo_icon_d2_single_run06_c25_grid_mean_p10_through_20260517_regional_renewable_features.csv

  open_meteo_weather_file: data/processed/open_meteo/open_meteo_icon_d2_single_run06_c25_grid_mean_p10_weather.csv
  open_meteo_base_url: https://single-runs-api.open-meteo.com/v1/forecast
  open_meteo_api_mode: single_run
  open_meteo_model: icon_d2
  open_meteo_single_run_hour_utc: "06:00"
  open_meteo_single_run_forecast_days: 2
  open_meteo_request_pause_seconds: 5.0
  open_meteo_retry_attempts: 8
  open_meteo_retry_backoff_seconds: 60.0
  open_meteo_start_date: "2025-06-01"
  open_meteo_end_date: "2026-05-23"
  open_meteo_batch_size: 25
  open_meteo_timeout_seconds: 240
  open_meteo_cell_selection: nearest
  open_meteo_point_selection: grid_mean
  open_meteo_max_points_per_cluster: 10
  open_meteo_force_download: false
  open_meteo_hourly_variables:
    - wind_speed_80m
    - wind_direction_80m
    - wind_speed_120m
    - wind_direction_120m
    - temperature_2m
    - dew_point_2m
    - surface_pressure
    - shortwave_radiation
    - direct_radiation
    - diffuse_radiation
    - cloud_cover
    - precipitation
    - snow_depth

  include_cluster_features: false
  include_ramps: true
